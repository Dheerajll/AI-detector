[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detector"
version = "0.1.0"
description = "A robust AI-generated text detection framework with calibration and uncertainty estimation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Detector Team"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "torch>=1.9.0",
    "transformers>=4.15.0",
    "sentencepiece>=0.1.96",
    "spacy>=3.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.931",
    "shap>=0.41.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
eval = [
    "shap>=0.41.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.scripts]
ai-detector = "ai_detector.cli:main"

[project.urls]
Homepage = "https://github.com/example/ai-detector"
Repository = "https://github.com/example/ai-detector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_detector = ["*.yaml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
